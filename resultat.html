<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultat de la comparaison des fichiers Properties</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .added { background-color: #d4edda; }
        .removed { background-color: #f8d7da; }
        .modified { background-color: #fff3cd; }
        .identical { color: green; font-weight: bold; }
    </style>
</head>
<body>
<h1>Comparaison entre file1.properties et file2.properties</h1>
<h2 class="identical">Les fichiers sont identiques</h2>
</body>
</html>
